<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVR CRM Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --ink:#18221F; --muted:#5B6863; --line:#D9E0DD; --stroke:#8A9792;
  --accent:#0E6B5C; --accent-soft:#E1F0EC; --gate:#9A6412; --gate-soft:#F7EDDC; --bad:#A8412F; --bad-soft:#F8E6E1;
  --info:#2F5E9E; --info-soft:#E3ECF8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614; --surface:#172020; --ink:#E3EAE7; --muted:#9AA8A3; --line:#2A3633; --stroke:#6B7A75;
    --accent:#5CC0AA; --accent-soft:#1B3530; --gate:#E0B066; --gate-soft:#342A1B; --bad:#E58A77; --bad-soft:#3A221D;
    --info:#8DB4EA; --info-soft:#1C2A3D;
  }
}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#172020; --ink:#E3EAE7; --muted:#9AA8A3; --line:#2A3633; --stroke:#6B7A75;
  --accent:#5CC0AA; --accent-soft:#1B3530; --gate:#E0B066; --gate-soft:#342A1B; --bad:#E58A77; --bad-soft:#3A221D;
  --info:#8DB4EA; --info-soft:#1C2A3D;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5}
.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;padding:0 8px;display:flex;flex-direction:column}
.brand small{font-weight:500;color:var(--muted);font-size:.78rem}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--muted)}
nav.side button:hover{background:var(--ground);color:var(--ink)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font-size:.72rem;font-weight:600;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--bad);color:var(--surface)}
.aside-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:.8rem;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.topbar h1{font-size:1.15rem;margin-right:auto}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.content{padding:22px 24px 60px;display:flex;flex-direction:column;gap:20px}
.demo-note{font-size:.82rem;background:var(--gate-soft);border-left:3px solid var(--gate);padding:8px 12px;color:var(--ink)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--stroke)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;font-size:.88rem}
textarea{width:100%;resize:vertical;min-height:60px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600}
label.f input,label.f select{color:var(--ink);font-weight:400}
label.f.req span::after{content:" *";color:var(--bad)}
.err{color:var(--bad);font-size:.78rem;font-weight:500}

/* cards / panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:1rem}
.panel .sub{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:500}
.kpi span{font-size:.8rem;color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--ground);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.warn{background:var(--gate-soft);color:var(--gate);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.info{background:var(--info-soft);color:var(--info);border-color:transparent}

/* reminders */
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.rem .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.rem .ico.silent{background:var(--bad-soft);color:var(--bad)}
.rem .ico.movein{background:var(--gate-soft);color:var(--gate)}
.rem .ico.view{background:var(--info-soft);color:var(--info)}
.rem .ico.new{background:var(--accent-soft);color:var(--accent)}
.rem .t{font-weight:600}
.rem .d{font-size:.82rem;color:var(--muted)}
.rem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);font-size:.88rem;padding:10px 0}

/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 212px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col.care{background:var(--gate-soft);border-color:transparent}
.col.lost{background:var(--bad-soft);border-color:transparent}
.col.won{background:var(--accent-soft);border-color:transparent}
.col header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:.8rem;font-weight:600;border-bottom:1px solid var(--line)}
.col header .num{color:var(--muted);font-weight:400}
.col .list{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.col.drop .list{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:6px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;cursor:grab;text-align:left}
.lead:hover{border-color:var(--stroke)}
.lead .nm{font-weight:600;font-size:.88rem;display:flex;justify-content:space-between;gap:6px}
.lead .meta{font-size:.76rem;color:var(--muted)}
.lead .row{display:flex;flex-wrap:wrap;gap:4px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ground);border:1px solid var(--line);font-size:.68rem;font-weight:700;color:var(--muted);flex:none}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--ground)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--ground)}
td.r,th.r{text-align:right}
tr.stale td{background:var(--gate-soft)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{font-size:1.15rem}
.drawer .body{padding:16px 20px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-size:.86rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
dl.info{margin:0;display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:.88rem}
dl.info dt{color:var(--muted);font-size:.8rem;font-weight:600;padding-top:1px}
dl.info dd{margin:0}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.ev::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .dot{width:9px;height:9px;border-radius:50%;background:var(--stroke);margin-top:6px;margin-left:2px}
.ev.st .dot{background:var(--accent)}
.ev .when{font-size:.75rem;color:var(--muted)}
.ev .txt{font-size:.86rem}
.unitpick{display:flex;flex-direction:column;gap:6px}
.unitpick label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.85rem}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100vh - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:31;padding:20px;display:none;flex-direction:column;gap:14px}
.modal.on{display:flex}
.modal-scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);z-index:30;display:none}
.modal-scrim.on{display:block}
.modal .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .form .full{grid-column:1/-1}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;font-size:.88rem;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

/* charts: single-series bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,190px) 1fr 52px;gap:10px;align-items:center;font-size:.84rem;position:relative}
.bar .lbl{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar.muted .fill{background:var(--stroke)}
.bar .val{text-align:right;color:var(--muted)}
.bar:hover .fill{filter:brightness(1.12)}
.bar:hover .lbl{font-weight:600}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--surface);font-size:.78rem;padding:6px 9px;border-radius:6px;pointer-events:none;display:none;max-width:240px}
.chart-cols{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.chart-cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart-cols .c i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0}
.chart-cols .c span{font-size:.75rem;color:var(--muted)}
.chart-x{display:flex;gap:14px;padding:4px}
.chart-x span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
details.tbl summary{font-size:.8rem;color:var(--muted);cursor:pointer}

/* import */
.dropzone{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.imp-err td{background:var(--bad-soft)}
.imp-fix{color:var(--gate);font-size:.78rem}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px}
  nav.side{flex-direction:row;flex-wrap:wrap}
  .aside-foot{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .modal .form{grid-template-columns:1fr}
  dl.info{grid-template-columns:1fr;gap:2px}
  dl.info dd{margin-bottom:6px}
}
</style>
</head>

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd = n => n==null?'—':(n/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+'M';
const fdate = s => { if(!s) return '—'; const x=new Date(s); return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); };
const fdt = s => { const x=new Date(s); return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const days = (a,b=TODAY) => Math.round((new Date(iso(b)) - new Date(a))/864e5);
const initials = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const me = () => USERS.find(u=>u.id===ui.user);
const isMgr = () => me().role==='manager';
const canSee = l => isMgr() || l.owner===ui.user;
const phoneOf = l => canSee(l) ? l.phone : l.phone.replace(/\d(?=[\d ]{4})/g,'•');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2800); }
function nowStamp(){ const x=new Date(TODAY); const r=new Date(); x.setHours(r.getHours(),r.getMinutes()); return x.toISOString(); }
function log(l,type,text){ l.history.push({at:nowStamp(),type,text}); }
function visibleLeads(){ return S.leads.filter(l=>isMgr()||l.owner===ui.user); }

/* ============ Reminders (run at 8:00 daily) ============ */
function reminders(){
  const out=[];
  for(const l of visibleLeads()){
    if(l.stage==='new') out.push({l,kind:'new',t:'New lead, not contacted yet',d:`Came in ${fdate(l.created)} via ${l.channel} · target: reply within 2 working hours`});
    if(['sent','followup'].includes(l.stage) && l.lastContact && days(l.lastContact)>=3)
      out.push({l,kind:'silent',t:`Silent for ${days(l.lastContact)} days`,d:`Follow-up #${l.followups+1}`+(l.followups>=3?' · over 3 attempts, consider moving to “Nurture”':'')});
    if(l.stage==='care'){ const n=-days(l.movein); if(n>=0&&n<=30) out.push({l,kind:'movein',t:`${n} days until move-in`,d:`In the nurture list · expected move-in ${fdate(l.movein)}`}); }
    if(l.viewingDate && days(l.viewingDate)===-1) out.push({l,kind:'view',t:'Viewing scheduled for tomorrow',d:`${fdate(l.viewingDate)} · ${l.sentUnits.map(x=>unitName(x)).join(', ')||'no unit selected yet'}`});
  }
  const order={new:0,view:1,silent:2,movein:3};
  return out.sort((a,b)=>order[a.kind]-order[b.kind]);
}

function card(l){

function wireBoard(){
  document.querySelectorAll('.lead[draggable]').forEach(c=>{
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);});
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');moveStage(e.dataTransfer.getData('text/plain'),col.dataset.stage);});
  });
}
function moveStage(id,stage,opts={}){
  const l=S.leads.find(x=>x.id===id); if(!l||l.stage===stage) return;
  if(!canSee(l)){ toast('This lead is not assigned to you.'); return; }
  if(stage==='lost' && !opts.reason){ openLostModal(l); return; }
  if(stage==='viewing' && !opts.date){ openViewingModal(l); return; }
  const from=l.stage; l.stage=stage;
  if(stage==='lost') l.lostReason=opts.reason;
  if(stage==='viewing') l.viewingDate=opts.date;
  if(from==='new' && l.firstResponseH==null){ l.firstResponseH=Math.max(0.2,(new Date(nowStamp())-new Date(l.created))/36e5); }
  l.lastContact=iso(TODAY);
  log(l,'stage',`“${stageName(from)}” → “${stageName(stage)}”`+(opts.reason?` · reason: ${opts.reason}`:'')+(opts.date?` · viewing on ${fdate(opts.date)}`:''));
  save(); render(); toast(`${l.name}: moved to “${stageName(stage)}”`);
}

function parseBudget(s){
  s=String(s||'').toLowerCase().replace(/,/g,'').trim(); if(!s) return null;
  const usd=s.match(/\$\s*([\d.]+)|([\d.]+)\s*usd/); if(usd) return Math.round(parseFloat(usd[1]||usd[2])*USD_VND/1e5)*1e5;
  const m=s.match(/([\d.]+)\s*(tr|triệu|m|million)\b/); if(m) return Math.round(parseFloat(m[1])*1e6);
  const n=parseFloat(s.replace(/[^\d.]/g,'')); if(!n) return null; return n<1000?n*1e6:Math.round(n);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open],[data-page]'); if(!t) return;
  if(t.dataset.page){ ui.page=t.dataset.page; try{history.replaceState(null,'','#'+ui.page);}catch(_){} render(); return; }
  if(t.dataset.move){ const [id,st]=t.dataset.move.split(':'); moveStage(id,st); return; }
  if(t.dataset.fu){ const l=S.leads.find(x=>x.id===t.dataset.fu); l.followups++; l.lastContact=iso(TODAY); if(l.stage==='sent'){ log(l,'stage','“Units sent” → “Following up”'); l.stage='followup'; } log(l,'note',`Follow-up #${l.followups}`); save(); render(); toast(`Logged follow-up #${l.followups} for ${l.name}`+(l.followups>3?' · over 3 attempts':'')); return; }
  if(t.dataset.verify){ const u=S.units.find(x=>x.id===t.dataset.verify); u.verified=iso(TODAY); save(); render(); toast(`${u.project}: verified as vacant today`); return; }
  if(t.dataset.tab){ ui.drawerTab=t.dataset.tab; renderDrawer(); return; }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
  if(t.dataset.open && !t.closest('#drawer')){ openDrawer(t.dataset.open); return; }
  switch(t.id){
    case 'closeDrawer': closeDrawer(); break;
    case 'newLeadBtn': openNewLead(); break;
    case 'resetBtn': S=seed(); save(); ui.impPreview=false; ui.imported=false; closeDrawer(); render(); toast('Sample data restored'); break;
    case 'exportBtn': { const rows=[['id','name','nationality','channel','budget_vnd','term','movein','stage','owner','lost_reason']].concat(visibleLeads().map(l=>[l.id,l.name,l.nat,l.channel,l.budget,l.term,l.movein,stageName(l.stage),staffName(l.owner),l.lostReason||''])); const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download='dvr-leads-demo.csv'; a.click(); toast('CSV exported — phone and email columns are left out'); break; }
    case 'addNote': { const l=S.leads.find(x=>x.id===ui.drawer), v=$('#note').value.trim(); if(!v) return; log(l,'note',v); l.lastContact=iso(TODAY); save(); renderDrawer(); toast('Note saved'); break; }
    case 'sendUnits': { const l=S.leads.find(x=>x.id===ui.drawer); const ids=[...document.querySelectorAll('input[name=pick]:checked')].map(i=>i.value); if(!ids.length){ toast('Select at least one unit'); return; } const stale=ids.filter(id=>days(S.units.find(u=>u.id===id).verified)>14); l.sentUnits=ids; log(l,'note','Units sent: '+ids.map(x=>unitName(x)).join(', ')); if(['new','contacted','care'].includes(l.stage)){ log(l,'stage',`“${stageName(l.stage)}” → “Units sent”`); l.stage='sent'; } l.lastContact=iso(TODAY); save(); render(); toast(stale.length?`Sent · note that ${stale.map(x=>unitName(x)).join(', ')} has been unverified for over 14 days`:`Sent ${ids.length} units · the CRM will remind you if the lead goes silent for 3 days`); break; }
    case 'previewImport': ui.impPreview=true; render(); break;
    case 'cancelImport': ui.impPreview=false; render(); break;
    case 'doImport': { IMPORT_ROWS.filter(r=>!r.err).forEach(r=>{ const lang={Japanese:'ja',Korea:'ko',Russian:'ru'}[r.raw.nat]||'en'; const owner=autoAssign(lang); const l={id:'L'+(++S.seq),name:r.raw.name,nat:r.raw.nat,lang,channel:r.out.channel,phone:'',email:'',budget:r.out.budget,term:r.out.term,movein:r.out.movein,area:'Mỹ An',beds:1,people:1,pet:false,owner,stage:'care',created:iso(d(-60)),lastContact:iso(d(-40)),followups:1,importance:'',lostReason:null,sentUnits:[],viewingDate:null,firstResponseH:3,history:[]}; log(l,'create','Imported from the 2026 Google Sheet · old status “Lost” (no reason) → “Nurture”'); S.leads.push(l); }); ui.imported=true; save(); render(); toast(`Imported ${IMPORT_ROWS.filter(r=>!r.err).length} leads into “Nurture”`); break; }
    case 'simForm': simulateForm(false); break;
    case 'simDup': simulateForm(true); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#modal').classList.contains('on')) closeModal(); else if(ui.drawer) closeDrawer(); }
  if(e.key==='Enter' && e.target.matches('.lead')) openDrawer(e.target.dataset.open);
});
document.addEventListener('change',e=>{
  if(e.target.id==='userSel'){ ui.user=e.target.value; ui.boardOwner='all'; closeDrawer(); render(); toast('Now viewing as '+me().name); }
  if(e.target.id==='ownerFilter'){ ui.boardOwner=e.target.value; render(); }
  if(e.target.id==='stageFilter'){ ui.stageFilter=e.target.value; render(); }
  if(e.target.id==='reassign'){ const l=S.leads.find(x=>x.id===ui.drawer); log(l,'note',`Reassigned: ${staffName(l.owner)} → ${staffName(e.target.value)}`); l.owner=e.target.value; save(); render(); toast('Lead reassigned'); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); } });
$('#scrim').onclick=closeDrawer; $('#mScrim').onclick=closeModal;
// chart tooltip
const tip=$('#tip');
document.addEventListener('mousemove',e=>{ const h=e.target.closest('[data-tip]'); if(!h){ tip.style.display='none'; return; } tip.textContent=h.dataset.tip; tip.style.display='block'; tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px'; tip.style.top=(e.clientY+14)+'px'; });

render();
</script>
</body>
</html>
