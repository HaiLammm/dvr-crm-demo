<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVR CRM Demo v3</title>
<meta name="description" content="Interactive demo of the DVR CRM built to the 2026-10-08 UX spines (DESIGN.md + EXPERIENCE.md) — v3: visual polish (wave 1) and layout pass (wave 2) over v2. Fictional data, in-memory only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (DESIGN.md frontmatter) ===== */
:root{
  --ground:#F5F7F6;--surface:#FFFFFF;--ink:#18221F;--muted:#5B6863;--line:#D9E0DD;--stroke:#7C8A85;
  --accent:#0E6B5C;--accent-soft:#E1F0EC;--gate:#8D5A0D;--gate-soft:#F7EDDC;--bad:#A8412F;--bad-soft:#F8E6E1;
  --info:#2F5E9E;--info-soft:#E3ECF8;--track:#D9E0DD;--target:#6A7873;--scrim:#18221F;--sheet-edge:#FFFFFF;
  --sans:'Be Vietnam Pro','IBM Plex Sans JP',system-ui,'Noto Sans',sans-serif;
  --mono:'IBM Plex Mono','IBM Plex Sans JP',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101614;--surface:#172020;--ink:#E3EAE7;--muted:#9AA8A3;--line:#2A3633;--stroke:#6B7A75;
    --accent:#5CC0AA;--accent-soft:#1B3530;--gate:#E0B066;--gate-soft:#342A1B;--bad:#E58A77;--bad-soft:#3A221D;
    --info:#8DB4EA;--info-soft:#1C2A3D;--track:#2A3633;--target:#8E9D97;--scrim:#000000;--sheet-edge:#6B7A75;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101614;--surface:#172020;--ink:#E3EAE7;--muted:#9AA8A3;--line:#2A3633;--stroke:#6B7A75;
  --accent:#5CC0AA;--accent-soft:#1B3530;--gate:#E0B066;--gate-soft:#342A1B;--bad:#E58A77;--bad-soft:#3A221D;
  --info:#8DB4EA;--info-soft:#1C2A3D;--track:#2A3633;--target:#8E9D97;--scrim:#000000;--sheet-edge:#6B7A75;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:64px}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 14.5px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
[tabindex="-1"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ov{font:600 11.5px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cap{font-size:12px;line-height:1.45;color:var(--muted)}
.lbl{font-size:12.8px;font-weight:600;line-height:1.4}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);min-width:0}
.aside-in{padding:16px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.brand{font-weight:700;padding:0 8px;display:flex;flex-direction:column}
.brand small{font-weight:400;font-size:12px;color:var(--muted)}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;min-height:36px}
nav.side a:hover{background:var(--ground);color:var(--ink)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{font:500 11.5px/1 var(--mono);min-width:20px;text-align:center;padding:3px 6px;border-radius:9999px;background:var(--bad);color:var(--surface)}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;font-weight:700;line-height:1.25;margin-right:auto}
.content{padding:20px 24px 72px;display:flex;flex-direction:column;gap:20px;min-width:0}
.demo-line{font-size:12px;color:var(--muted)}

/* ===== Controls ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--stroke);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:13.5px;line-height:1.3;min-height:32px;white-space:nowrap}
.btn:hover{background:var(--ground)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:12.8px;min-height:28px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.icon{padding:3px 8px;min-width:28px}
a.btn{text-decoration:none}
.btn.ghost{background:var(--surface);border-color:var(--stroke);color:var(--ink);font-weight:600;font-size:12.8px} /* open-chat = button-secondary, never accent */
.btn.ghost:hover{background:var(--ground)}
.btn.ghost .ext{color:var(--muted);font-size:11.5px}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--stroke);text-underline-offset:3px;text-align:left;font:inherit}
.lnk:hover{color:var(--accent)}
.fig{background:none;border:0;padding:0;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;text-decoration:underline;text-decoration-color:var(--stroke);text-decoration-thickness:1px;text-underline-offset:3px;font-size:inherit}
.fig:hover{text-decoration-color:var(--ink);text-decoration-thickness:2px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=datetime-local],select,textarea{border:1px solid var(--stroke);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 9px;font-size:14px;min-height:34px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.8px;font-weight:600;min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;width:100%}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.err{color:var(--bad);font-size:12.8px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:6px;overflow:hidden;background:var(--surface);max-width:100%;flex-wrap:nowrap}
.seg button{border:0;border-left:1px solid var(--stroke);background:var(--surface);color:var(--ink);padding:4px 10px;font:600 12.8px/1.3 var(--sans);min-height:30px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;box-shadow:inset 0 0 0 4px var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stroke);background:var(--surface);color:var(--ink);border-radius:9999px;padding:3px 12px;font-size:13px;min-height:30px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓"}
.fchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--stroke);background:var(--surface);border-radius:9999px;padding:0 2px 0 10px;font-size:13px}
.fchip button{width:24px;height:24px;border:0;background:none;border-radius:9999px;display:grid;place-items:center;padding:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.4;padding:1px 8px;border-radius:9999px;background:var(--ground);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--gate-soft);color:var(--gate)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.out{background:var(--surface);border:1px dashed var(--stroke);color:var(--ink)}
.share{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:9999px;background:var(--info-soft);color:var(--info);border:1px solid var(--info);white-space:nowrap}
.rec{display:inline-block;font:600 11.5px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--info);background:var(--surface);border:1px solid var(--info);border-radius:4px;padding:0 5px}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;flex:none}
.cb{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;cursor:pointer}
.cb input{width:18px;height:18px;margin:0;accent-color:var(--accent);cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h2,.sect-h{font-size:16px;font-weight:700;line-height:1.3}
.notice{background:var(--surface);border:1px dashed var(--stroke);border-radius:8px;padding:14px 16px;color:var(--muted)}
.row-flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}

/* availability chip */
.avail{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stroke);background:var(--surface);color:var(--ink);border-radius:9999px;padding:3px 12px;font-size:13px;min-height:30px}
.glyph{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.glyph.available{background:var(--ink)}
.glyph.limited{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.glyph.away{background:transparent}
.availtxt{display:inline-flex;align-items:center;gap:6px;font-size:13px}

/* ===== Today ===== */
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pagehead h2{font-size:18px;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kcell{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpair{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.kpair .sub{display:flex;flex-direction:column}
.kpair .divv{width:1px;align-self:stretch;background:var(--line)}
.kv{font:500 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.kv.zero{color:var(--muted)}
.kv.bad{color:var(--bad)}
.comp{display:flex;height:6px;gap:2px}
.comp span{display:block;height:100%;min-width:2px}
.comp span:last-child{border-radius:0 4px 4px 0}
.s0{background:var(--ink)}.s1{background:var(--muted)}.s2{background:var(--stroke)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}
.marks{display:flex;gap:2px;height:6px}
.marks i{width:6px;height:6px;background:var(--bad);border-radius:0 4px 4px 0;display:block}
.ageline{font-size:12px;color:var(--bad)}
.updates{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.updates ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.upd-more{display:none;background:none;border:0;padding:0;color:var(--ink);font:600 12.8px/1.4 var(--sans);text-decoration:underline;text-decoration-color:var(--stroke);text-underline-offset:3px;text-align:left;width:100%;min-height:44px;align-items:center;gap:6px}
.upd-more:hover{color:var(--ink)}
.upd-more .chev{color:var(--stroke);font-size:11px;text-decoration:none}
.kpi-sum{display:none;width:100%;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--stroke);border-radius:8px;padding:9px 14px;min-height:44px;text-align:left;font-size:14px;color:var(--ink)}
.kpi-sum .od-n{color:var(--bad);font-weight:600}
.kpi-sum .chev{color:var(--stroke);font-size:12px}
.kpi-sum .sep{color:var(--muted)}
.kpi-sum .w{font-size:12.8px;font-weight:600}
.kpi-sum .zero{color:var(--muted)}
.draft{border:1px dashed var(--gate);background:var(--gate-soft);color:var(--gate);border-radius:6px;padding:6px 10px;font-size:12.8px;font-weight:600}
.retprompt{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--stroke);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px}
.retprompt .q{flex:1 1 200px;font-weight:600;font-size:13.5px}
.retprompt .row-flex{gap:6px}
.preview{background:var(--ground);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--ink);font-size:14px;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.preview .mono{font-size:13px}
.trialnote{background:var(--surface);border:1px dashed var(--stroke);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.trialnote ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px}
.groups{display:flex;flex-direction:column;gap:14px}
.rgroup{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--stroke);border-radius:0 8px 8px 0;overflow:hidden}
.rgroup>.band{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--ground);border-bottom:1px solid var(--line)}
.rgroup>.band h3{font-size:12.8px;font-weight:600;line-height:1.4}
.rgroup>.band .c{margin-left:auto;font:400 12px var(--mono);color:var(--muted)}
.rgroup.k-new{border-left-color:var(--accent)}.rgroup.k-new>.band{background:var(--accent-soft)}.rgroup.k-new>.band h3{color:var(--accent)}
.rgroup.k-view{border-left-color:var(--info)}.rgroup.k-view>.band{background:var(--info-soft)}.rgroup.k-view>.band h3{color:var(--info)}
.rgroup.k-silent{border-left-color:var(--bad)}.rgroup.k-silent>.band{background:var(--bad-soft)}.rgroup.k-silent>.band h3{color:var(--bad)}
.rgroup.k-movein{border-left-color:var(--gate)}.rgroup.k-movein>.band{background:var(--gate-soft)}.rgroup.k-movein>.band h3{color:var(--gate)}
.rgroup.k-assign>.band h3,.rgroup.k-fu>.band h3{color:var(--ink)}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rgroup>.band+.rrow,.rgroup>.band+.nextcard{border-top:0}
.kg{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--ground);color:var(--muted)}
.k-new .kg{background:var(--accent-soft);color:var(--accent)}.k-view .kg{background:var(--info-soft);color:var(--info)}
.k-silent .kg{background:var(--bad-soft);color:var(--bad)}.k-movein .kg{background:var(--gate-soft);color:var(--gate)}
.rrow .nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rrow .dt{font-size:12.8px;color:var(--muted)}
.rrow .dt b{font:400 12.8px var(--mono);color:var(--ink)}
.od{display:inline-flex;align-items:center;gap:4px;color:var(--bad);font-size:12.8px;font-weight:600;margin-top:2px}
.od svg{width:13px;height:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.sb{display:inline-flex;border-radius:6px;background:var(--accent);overflow:hidden}
.sb button{background:var(--accent);color:var(--surface);border:0;font:600 12.8px/1.3 var(--sans);padding:4px 10px;min-height:30px;white-space:nowrap}
.sb .sb-caret{min-width:24px;padding:0 6px;border-left:1px solid var(--surface)}
.sb button:focus-visible{outline:2px solid var(--surface);outline-offset:-3px}
.sb button:hover{filter:brightness(1.08)}
.nextcard{background:var(--ground);border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.nextcard .conf{font-size:12px;color:var(--muted)}
.nextcard .conf b{color:var(--accent)}
.nextcard .prompt{font-size:12.8px;font-weight:600}
.empty-state{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--stroke);border-radius:0 8px 8px 0;padding:16px}
.empty-state h2{font-size:16px}
.coming{display:flex;flex-direction:column;gap:10px}
.coming .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.cu{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px 10px}
.cu h3{margin-top:8px}
.cu ul{list-style:none;margin:4px 0 0;padding:0}
.cu li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.cu li:first-child{border-top:0}
.cu .g{color:var(--muted);width:14px;text-align:center;flex:none}

/* ===== Pipeline ===== */
.selbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--surface);border:1px solid var(--stroke);border-radius:8px;padding:8px 12px}
.selbar .msg{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;min-width:0}
.col{flex:0 0 212px;width:212px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.col.nurture{background:var(--gate-soft)}.col.lost{background:var(--bad-soft)}.col.signed{background:var(--accent-soft)}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12.8px;font-weight:600;border-bottom:1px solid var(--line)}
.col>header .num{color:var(--muted);font-weight:400}
.col .list{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:80px}
.col.drop .list{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:6px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.lcard{border-color:var(--stroke)}
.lcard:hover{border-color:var(--ink)}
.lcard[aria-selected="true"]{background:var(--accent-soft);border:2px solid var(--accent);padding:5px 7px 7px}
.lcard .top{display:flex;align-items:center;gap:4px}
.lcard .top .n{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .top .av{width:24px;height:24px;font-size:10px}
.lcard .meta{font-size:12px;color:var(--muted)}
.lcard .mv{font-size:12px;color:var(--ink)}
.lcard .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

/* ===== Tables ===== */
.tw{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
thead th{font:600 11.5px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--ground);border-top:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td,tbody tr.click:hover th{background:var(--ground)}
td.r,th.r{text-align:right}
tr.stale td{background:var(--gate-soft)}
.wl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);scroll-padding-inline-start:130px;max-width:100%}
table.wl{min-width:940px}
table.wl thead tr.grp th{color:var(--ink);background:var(--surface);border-bottom:1px solid var(--line)}
table.wl thead tr:not(.grp) th{white-space:normal;vertical-align:bottom;min-width:56px}
table.wl th,table.wl td{padding:8px 8px}
table.wl td:nth-child(2){white-space:normal;min-width:150px}
table.wl .gl{border-left:1px solid var(--line)}
table.wl th[scope=row],table.wl thead tr:not(.grp) th:first-child,table.wl thead tr.grp td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
table.wl tbody th[scope=row]{font:600 13.5px var(--sans);text-transform:none;letter-spacing:0;color:var(--ink)}
table.wl .comp{width:120px;margin-top:6px}
.wnote{display:block;font-size:12px;color:var(--muted);font-style:italic;white-space:normal;max-width:190px}
.teamline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px}
.callout{border-left:3px solid var(--gate);background:var(--gate-soft);border-radius:0 8px 8px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.callout .t{color:var(--gate);font-weight:600;font-size:12.8px}
.pairc{display:flex;flex-direction:column;gap:2px}
.withheld{font-size:12.8px;color:var(--muted);font-weight:600}

/* ===== Dashboard ===== */
.dkpis{display:grid;grid-template-columns:1fr 1.7fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dkpis.agent{grid-template-columns:repeat(3,1fr)}
.dk{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.dk .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dk .v em{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}
.meas{height:3px;background:var(--track);position:relative;border-radius:0 2px 2px 0;margin:4px 0 3px}
.meas i{position:absolute;left:0;top:0;height:3px;background:var(--ink);border-radius:0 4px 4px 0}
.meas u{position:absolute;top:-3px;width:2px;height:9px;background:var(--target)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.axis{border-left:2px solid var(--target);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.8px}
.hbar .track{height:12px;background:var(--ground);border-radius:0 4px 4px 0;position:relative}
.hbar .fill{height:12px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hbar .fill.muted{background:var(--stroke)}
.hbar .vv{font:400 12.5px var(--mono);color:var(--muted);white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:12px;height:150px;border-left:2px solid var(--target);padding:0 0 0 12px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.cols .c i{display:block;width:100%;max-width:40px;background:var(--accent);border-radius:4px 4px 0 0}
.cols .c span{font:400 12px var(--mono);color:var(--muted)}
.colsx{display:flex;gap:12px;padding-left:14px}
.colsx span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
details.tbl summary{font-size:12.8px;color:var(--ink);cursor:pointer}
details.tbl table{margin-top:6px}
.demo-ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.8px;color:var(--muted)}

/* ===== Overlays ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:.42;z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer .dh{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer .dh .t{display:flex;gap:8px;align-items:flex-start}
.drawer .dh h2{font-size:18px;font-weight:700;flex:1;min-width:0}
.drawer .db{padding:14px 20px 48px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer .band-rec{background:var(--ground);color:var(--muted);font-size:12.8px;padding:8px 20px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
dl.info{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px}
dl.info dt{color:var(--muted);font-size:12.8px;font-weight:600;padding-top:1px}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl li::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.mk{width:10px;height:10px;margin:5px 0 0 2px;border:1.5px solid var(--stroke);border-radius:50%;background:var(--surface)}
.mk.stage{background:var(--accent);border-color:var(--accent)}
.mk.sys{border-radius:1px}
.tl .w{font-size:12px;color:var(--muted)}
.uplist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.uplist li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:14px}
.uplist li:first-child{border-top:0}
.uplist li.canceled{color:var(--muted);text-decoration:line-through}
.mu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mu label{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--stroke);border-radius:6px;padding:8px 10px;cursor:pointer}
.mu .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.drill{list-style:none;margin:0;padding:0}
.drill li{border-top:1px solid var(--line)}
.drill li:first-child{border-top:0}
.drill button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:9px 4px;text-align:left;font-size:14px;color:var(--ink)}
.drill button:hover{background:var(--ground)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100vh - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:31;padding:20px;display:none;flex-direction:column;gap:14px}
.modal.on{display:flex}
.modal.sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:85vh;border-radius:10px 10px 0 0;border:0;border-top:1px solid var(--sheet-edge);padding:16px 16px 0;scroll-padding-bottom:72px}
.modal.full{left:0;top:0;right:0;bottom:0;transform:none;width:100%;max-height:none;height:100%;border-radius:0;border:0;padding:16px 16px 0;scroll-padding-bottom:80px}
.mscrim{position:fixed;inset:0;background:var(--scrim);opacity:.5;z-index:30;display:none}
.mscrim.on{display:block}
.modal h2{font-size:16px;font-weight:700}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal.sheet .foot,.modal.full .foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 0 16px;margin-top:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-size:12.8px;font-weight:600;margin-bottom:4px}
.blockh{font:600 11.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.dup{border:1px solid var(--bad);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;gap:8px;font-size:13.5px}
.dup.other{border-color:var(--stroke)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--stroke);border-radius:6px;padding:7px 10px;font-size:14px;cursor:pointer}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--stroke);border-radius:6px;padding:8px 10px;cursor:pointer}
.cand .w{color:var(--gate);font-size:12.8px;font-weight:600}
.pop{position:fixed;z-index:25;background:var(--surface);border:1px solid var(--stroke);border-radius:8px;padding:12px;display:none;flex-direction:column;gap:10px;max-width:calc(100vw - 32px)}
.pop.on{display:flex}
[role=menu]{display:flex;flex-direction:column;padding:4px 0}
[role=menuitem]{background:none;border:0;text-align:left;padding:7px 14px;font-size:14px;color:var(--ink);min-height:34px;text-decoration:none;display:flex;align-items:center;gap:6px}
[role=menuitem]:hover,[role=menuitem]:focus{background:var(--ground)}
[role=menuitem].danger{color:var(--bad)}
.pop.menu{padding:4px 0;min-width:180px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;display:none;max-width:calc(100% - 32px);gap:12px;align-items:center}
.toast.on{display:flex}
.toast .lnk{color:var(--surface);text-decoration-color:var(--surface);font-weight:600}
.toast .lnk:focus-visible{outline-color:var(--surface)}


/* ===== v3 polish (wave 1) — CSS-first, DESIGN.md tokens only; no shadows, gradients or new hues ===== */
/* Rhythm: page padding 24, panels 20 apart, 8–12 inside components */
.content{padding:24px 24px 80px;gap:20px}
.panel{padding:16px 20px 18px;gap:14px}
.panel>h2,.sect-h{font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.005em}
.pagehead{gap:8px 14px}
.pagehead h2{letter-spacing:-.01em}
.row-flex{gap:8px 10px}
/* Decision 1 — mono only for table numeric columns, KPI values, figure links, chart values and Lead IDs.
   Figures inside prose (reminder details, profile values, card meta, captions) stay in the sans stack, tabular. */
.tn{font-variant-numeric:tabular-nums}
.rrow .dt b,dl.info .mono,dl.info dd.mono,.lcard .meta .mono,.cap .mono,.hint.mono,.uplist .mono{font-family:var(--sans);font-variant-numeric:tabular-nums}
.rrow .dt b{font-weight:600;font-size:12.8px;color:var(--ink)}
/* Decision 2 — nav count badge: neutral pill; rust only when the page holds an overdue item */
.badge{font:600 11.5px/1 var(--sans);font-variant-numeric:tabular-nums;min-width:22px;padding:4px 7px;background:var(--line);color:var(--ink)}
.badge.is-od{background:var(--bad);color:var(--surface)}
nav.side{gap:4px}
nav.side a{padding:8px 12px}
/* Today — hierarchy by edge and weight, more air between rows */
.strip{border-radius:8px}
.kcell{padding:14px 18px 16px;gap:8px}
.updates{padding:12px 18px 14px;gap:8px}
.groups{gap:16px}
.rgroup>.band{padding:8px 16px}
.rgroup>.band .c{font:600 12px var(--sans);font-variant-numeric:tabular-nums}
.rrow{padding:12px 16px;gap:14px}
.rrow .nm{font-size:14.5px;gap:8px}
.rrow .nm .tag{font-weight:600}
.rrow .dt{margin-top:2px;line-height:1.5}
.rrow .od{margin-top:4px}
.nextcard{padding:12px 16px 14px;gap:8px}
.coming{gap:12px}
.cu{padding:8px 16px 12px}
.cu li{padding:7px 0}
/* Pipeline — neutral 3px group rule per stage group; tidier cards (checkbox + up to 3 tags kept) */
.board{gap:12px}
.col.g-work{border-top:3px solid var(--ink)}
.col.g-close{border-top:3px solid var(--stroke)}
.col.g-end{border-top:3px solid var(--line)}
.col>header{padding:9px 12px;font-size:12.8px}
.col>header .num{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.col .list{padding:10px 8px;gap:8px}
.lcard{padding:8px 9px 10px;gap:4px}
.lcard[aria-selected="true"]{padding:7px 8px 9px}
.nw{white-space:nowrap}
.lcard .top{gap:6px;margin-left:-3px}
.lcard .top .n{font-size:13.5px;line-height:1.35}
.lcard .meta{font-size:12px;line-height:1.45;font-variant-numeric:tabular-nums}
.lcard .mv{font-size:12px;line-height:1.45}
.lcard .tags{gap:4px;margin-top:4px}
/* Tables — sticky header inside a vertically bounded wrapper; horizontal scroll stays in the wrapper */
.tw-y table{border-collapse:separate;border-spacing:0}
.tw-y thead th{position:sticky;top:0;z-index:2;background:var(--ground);border-bottom:1px solid var(--line)}
.tw-y tbody tr:first-child>*{border-top:0}
.tw-y{max-height:calc(100vh - 170px);overflow:auto;overscroll-behavior-y:contain}
th,td{padding:10px 12px}
td.mono,td .mono{font-size:13px}
/* Stale units — legend explains the amber wash */
.stale-legend{display:flex;align-items:center;gap:8px;font-size:12.8px;color:var(--muted);margin:0}
.stale-legend i{flex:none;width:28px;height:14px;border-radius:2px;background:var(--gate-soft);border:1px solid var(--line)}
.stale-legend b{color:var(--ink);font-weight:600}
/* Dashboard */
.dk{padding:14px 18px;gap:6px}
.dgrid{gap:20px}

/* ===== v3 layout (wave 2) — demo toolbar, icon sidebar, grouped profile, dashboard banner; DESIGN.md tokens only ===== */
/* A — two-tier top: demo chrome (dashed = not product, as notice-muted) above the product shell */
.app{grid-template-rows:auto minmax(0,1fr)}
.demobar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:5px 24px;background:var(--ground);border-bottom:1px dashed var(--stroke);font-size:12px;color:var(--muted);min-width:0}
.demo-k{font:600 11.5px/1.4 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);border:1px dashed var(--stroke);border-radius:4px;padding:1px 6px;white-space:nowrap}
.demo-note{flex:1 1 260px;min-width:0}
.demo-note .mono{font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}
.demo-ctls{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.demobar .ctl{display:flex;align-items:center;gap:6px;min-width:0}
.demobar select{min-height:28px;padding:3px 8px;font-size:12.8px}
.demobar .btn.sm{min-height:28px}
.dn-short{display:none}
.topbar{flex-wrap:nowrap;gap:12px;min-height:56px}
.topbar h1{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar #newLeadBtn{flex:none}
/* B — brand block and monochrome nav icons (inline SVG, currentColor, label kept) */
.aside-in{gap:12px} /* aside stretches with its grid row (no 100vh under the demo bar); the inner block stays sticky */
.brand{flex-direction:row;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid var(--line)}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:6px;background:var(--ink);color:var(--surface);font:700 15px/1 var(--sans);letter-spacing:-.02em}
.brand-t{display:flex;flex-direction:column;font-size:15.5px;line-height:1.25;letter-spacing:-.01em;min-width:0}
.brand-t small{font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
nav.side a .nl{display:inline-flex;align-items:center;gap:10px;min-width:0}
nav.side a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* C — Lead profile: one-line action row; Profile tab grouped */
.dh .acts-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dh .acts-row .btn.sm{padding:3px 9px}
.pgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"contact needs" "own needs";gap:18px 24px;align-items:start}
.pg{display:flex;flex-direction:column;gap:6px;min-width:0}
.pg.g-contact{grid-area:contact}.pg.g-needs{grid-area:needs}.pg.g-own{grid-area:own}
.pg>h3{padding-bottom:6px;border-bottom:1px solid var(--line)}
.pg dl.info{grid-template-columns:minmax(0,1fr);gap:0}
.pg dl.info dt{padding-top:8px}
.pg dl.info dt:first-child{padding-top:0}
.pg dl.info dd{line-height:1.45}
/* D — sample-data notice as a gate-soft banner; workload fits without sideways scroll at ≥1280px */
.demo-ctl.sample{background:var(--gate-soft);border-left:3px solid var(--gate);border-radius:0 8px 8px 0;padding:10px 14px;color:var(--ink);font-size:13px}
.demo-ctl.sample .tag{background:var(--surface);color:var(--gate);border:1px solid var(--gate)}
.demo-ctl.sample .why{flex:1 1 320px;min-width:0;color:var(--ink)}
.demo-ctl.sample label{color:var(--ink);font-weight:600}
@media (min-width:1280px){
  table.wl th,table.wl td{padding:8px 6px}
  table.wl th:first-child,table.wl td:first-child{padding-left:12px}
  table.wl thead tr:not(.grp) th{min-width:48px}
  table.wl td:nth-child(6),table.wl td.gl.r,table.wl td:last-child{white-space:normal}
  table.wl td:last-child{min-width:112px}
  table.wl td:nth-child(6) .fig{text-align:left}
  .wnote{max-width:150px}
}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 16px;gap:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .aside-in{position:static;max-height:none;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;padding:0;gap:8px 12px}
  nav.side{flex-direction:row;flex-wrap:wrap}
  .demobar{padding:6px 16px}
  .brand{padding:0 8px 0 0;border-bottom:0}
  .demobar select,.demobar .btn.sm{min-height:40px}
  .pg dl.info dd{margin-bottom:0}
  .content{padding:16px 16px 80px}
  .topbar{padding:8px 16px}
  .dkpis,.dkpis.agent{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dkpis .wide{grid-column:1/-1}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  dl.info{grid-template-columns:minmax(0,1fr);gap:0}
  dl.info dd{margin-bottom:8px}
  .btn,.seg button,.chip,.avail,select,input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=month]{min-height:40px}
  .sb button,.btn.sm{min-height:40px}
  .sb .sb-caret{min-width:40px}
  nav.side a{min-height:40px}
  .tw-y{overscroll-behavior-y:auto}
}
@media (max-width:639px){
  .strip{grid-template-columns:minmax(0,1fr)}
  .kpi-sum{display:flex}
  .strip.collapsed{display:none}
  .updates:not(.open) li.ext{display:none}
  .upd-more{display:flex}
  .demobar .ctl label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .demobar{gap:6px 10px}
  .demo-ctls{gap:8px}
  .demo-note{flex-basis:auto}
  .demobar .dn-long{display:none}
  .demobar .dn-short{display:inline}
  .pgroups{grid-template-columns:minmax(0,1fr);grid-template-areas:"contact" "needs" "own"}
  .brand-mark{width:26px;height:26px;font-size:13px}
  .topbar h1{font-size:16px}
  .content{gap:12px;padding-top:12px}
  .brand small{display:none}
  .rrow{grid-template-columns:auto minmax(0,1fr)}
  .rrow .acts{grid-column:1/-1;justify-content:flex-end}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .selbar{position:fixed;left:0;right:0;bottom:0;border-radius:0;border-left:0;border-right:0;z-index:15}
  body.has-sel{scroll-padding-bottom:120px;padding-bottom:120px}
  .hbar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto}
  .drawer .dh,.drawer .db{padding-left:16px;padding-right:16px}
  .content{padding:12px 16px 80px}
  .rrow{padding:12px 14px;gap:10px 12px}
  .tw-y{max-height:calc(100vh - 140px)}
}
</style>
</head>

<div class="app" id="app">
  <div class="demobar" id="demoBar" role="region" aria-label="Demo controls (not part of the product)">
    <span class="demo-k">Demo controls</span>
    <span class="cap demo-note"><span class="dn-long">Fictional data · in memory only · simulated now</span><span class="dn-short">Fictional · Simulated now</span> <span class="mono">Thu 8 Oct 2026 09:12</span></span>
    <div class="demo-ctls">
      <div class="ctl"><label for="roleSel" class="cap">Signed in as</label>
        <select id="roleSel"><option value="agent">Saki · Agent</option><option value="manager">Saki Taguchi · Manager</option></select></div>
      <div class="ctl"><label for="themeSel" class="cap">Appearance</label>
        <select id="themeSel"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
      <button class="btn sm" data-act="reset" aria-label="Reset sample data">Reset<span class="dn-long"> sample data</span></button>
    </div>
  </div>

// Channel = last used, else Lead Source when it is a Channel. Opening chat writes nothing.
const digits=s=>String(s||'').replace(/\D/g,'');
const okHandle=h=>/^[A-Za-z0-9._-]+$/.test(h||'');
function chatFor(l,ch){ // {href} | {copy,kind} | null
  const ph=digits(l.phone), cp=l.phone?{copy:l.phone,kind:'phone',ch}:null;
  if(ch==='WhatsApp')return ph?{href:'https://wa.me/'+ph,ch}:null;
  if(ch==='Zalo')return ph?{href:'https://zalo.me/'+ph,ch}:null;
  if(ch==='Phone')return ph?{href:'tel:+'+ph,ch}:null;
  if(ch==='Email')return l.email?{href:'mailto:'+l.email,ch}:null;
  if(ch==='LINE')return l.lineId&&okHandle(l.lineId)?{href:'https://line.me/ti/p/~'+l.lineId,ch}:l.lineId?{copy:l.lineId,kind:'handle',ch}:cp;
  if(ch==='Messenger')return l.messenger&&okHandle(l.messenger)?{href:'https://m.me/'+l.messenger,ch}:l.messenger?{copy:l.messenger,kind:'handle',ch}:cp;
  return cp; // KakaoTalk: no link format
}
function chatTarget(l){ // kept for tests: the target for the prefilled Channel
  const ch=prefill(l); return ch?chatFor(l,ch):null;
}
const appName=ch=>ch==='Email'?'your email app':ch==='Phone'?'the phone dialer':'the '+ch+' app';
const chatName=(l,ch)=>`Open chat with ${l.name} on ${ch} — opens ${appName(ch)}, leaves the CRM`;
const EXT='<span class="ext" aria-hidden="true">↗</span>', CPY='<span class="ext" aria-hidden="true">⧉</span>';
function chatLink(l,t,cls,idA,inner){return `<a class="${cls}"${idA} data-chat="${l.id}" href="${esc(t.href)}" target="_blank" rel="noopener" aria-label="${esc(chatName(l,t.ch))}">${inner}</a>`;}
function chatCtl(l,{cls='btn sm ghost',id=''}={}){
  const idA=id?` id="${id}"`:'', ch=prefill(l);
  if(!ch){ // No Channel to choose by: Open chat ▾ lists only Channels with an address, plus the copy fallback
    if(!chatMenuItems(l).length)return '';
    return `<button class="${cls}"${idA} data-act="chatmenu" data-chat="${l.id}" data-id="${l.id}" aria-haspopup="menu" aria-label="Open chat with ${esc(l.name)} — choose a Channel">Open chat ▾</button>`;
  }
  const t=chatFor(l,ch); if(!t)return '';
  if(t.href)return chatLink(l,t,cls,idA,`Open chat · ${t.ch} ${EXT}`);
  return `<button class="${cls}"${idA} data-act="copy-contact" data-chat="${l.id}" data-id="${l.id}" data-v="${esc(t.copy)}" data-kind="${t.kind}" data-ch="${t.ch}">${CPY} Copy ${t.kind}</button>`;
}
function chatMenuItems(l,{copy=false}={}){
  const it=[];
  ['WhatsApp','Zalo','LINE','Messenger','Email','Phone'].forEach(ch=>{const t=chatFor(l,ch);if(t&&t.href)it.push(`<a role="menuitem" tabindex="-1" data-chat="${l.id}" data-act="chat-pick" data-ch="${ch}" ${copy?'data-copy="1"':''} href="${esc(t.href)}" target="_blank" rel="noopener" aria-label="${esc(chatName(l,ch))}">${ch} ${EXT}</a>`);});
  if(l.phone&&!copy)it.push(`<button role="menuitem" tabindex="-1" data-act="copy-contact" data-id="${l.id}" data-v="${esc(l.phone)}" data-kind="phone" data-ch="">${CPY} Copy phone</button>`);
  return it;
}
async function copyText(v,okMsg,failMsg){
  let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await Promise.race([navigator.clipboard.writeText(v),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),1500))]); ok=true; } }catch(e){ ok=false; }
  const msg=ok?okMsg:failMsg;
  toast(msg,{silent:true}); announce(msg); return ok;
}
function copyContact(d){
  const l=lead(d.id), v=d.v;
  const ok=d.kind==='phone'?`${l.name}'s phone number copied${d.ch?' · paste it in '+d.ch:''}`:`${l.name}'s ${d.ch} handle copied`;
  copyText(v,ok,`Couldn't copy automatically · ${d.kind==='phone'?'phone':d.ch+' handle'}: ${v}`);
}

const KINDLABEL={first:'First contact',silent1:'Follow-up 1',silent2:'Follow-up 2',silent3:'Follow-up 3 or more',movein:'Move-in approaching',viewing:'Viewing tomorrow',followup:'Follow up as promised',book:'Propose a viewing'};
function mvText(l,lg){ // Move-in at its precision, in the Lead Language
  const mv=l.movein, t=MT[lg];
  if(!mv||mv.p==='undecided')return t.undecided; if(mv.p==='asap')return t.asap;
  if(mv.p==='month'){const [y,m]=mv.v.split('-').map(Number);return lg==='ja'?`${y}年${m}月`:lg==='ko'?`${y}년 ${m}월`:lg==='vi'?`tháng ${m}/${y}`:lg==='ru'?`${String(m).padStart(2,'0')}.${y}`:MONL[m-1]+' '+y;}
  const d=pd(mv.v);return lg==='ja'?`${d.getMonth()+1}月${d.getDate()}日`:lg==='ko'?`${d.getMonth()+1}월 ${d.getDate()}일`:lg==='vi'?fdm(mv.v):lg==='ru'?fdm(mv.v).replace('/','.'):fd(mv.v);
}
function profileKind(l){ // the template of the Lead's open Reminder row, else follow-up
  if(l.owner!==ME())return {kind:'log'};
  const g=rowsFor(ME());
  for(const [k] of GROUPS){const r=(g[k]||[]).find(x=>x.l.id===l.id);if(r&&k!=='assign'&&!(k==='fu'&&r.f.step==='Send units'))return {kind:k,fu:r.f&&r.f.id};}
  return {kind:'log'};
}
function tplKey(l,kind,fuId){
  if(kind==='new')return 'first'; if(kind==='movein')return 'movein'; if(kind==='view')return 'viewing';
  if(kind==='silent'){const n=l.followups+1;return n>=3?'silent3':n===2?'silent2':'silent1';}
  if(kind==='fu'){const f=l.fus.find(x=>x.id===fuId);if(f&&f.step==='Send units')return null;return f&&f.step==='Book a viewing'?'book':'followup';}
  return 'followup';
}
function composeMsg(l,kind,fuId){
  const lg=MT[l.lang]?l.lang:'en', t=MT[lg]; let key=tplKey(l,kind,fuId); if(!key)return null;
  const tk=(!l.sentUnits.length&&t[key+'n'])?key+'n':key;
  const units=l.sentUnits.map(id=>S.units.find(u=>u.id===id).name).join(t.sep);
  const vu=l.viewing?S.units.find(u=>u.id===l.viewing.unit):null;

  const text=t[tk].replace(/\{(\w+)\}/g,(_,k)=>rep[k]);

}

function onVisibility(){
  if(document.visibilityState==='hidden'){ if(ui.depart)ui.depart.hidden=true; return; }
  const d=ui.depart; if(!d||!d.hidden)return; ui.depart=null;
  if(Date.now()-d.at>30*60e3)return; // expired
  const l=lead(d.id); if(!l)return;
  if(d.kind!=='log'&&groupIndex(d.kind,d.id,d.fu)<0)return; // row gone
  if(d.kind==='view'&&l.cleared.view)return;
  if(modalCtx)closeModal({noFocus:true});
  ui.prompt=d; render();
  const b=$('#rpGo'); if(b)b.focus();
  announce(`${l.name} on ${d.ch} — contacted? ${promptLabel(d).replace(' · ',', ')}`);
}
function unitChecked(id,from){

}

function silentRaised(l){return nextWork(add(l.lastContact,3));}
function rowsFor(uid){
  const out={new:[],view:[],silent:[],movein:[],assign:[],fu:[]};
  for(const l of S.leads){
    if(l.owner===uid){
      if(l.stage==='new'){const c=l.created.slice(0,10), t=l.created.slice(11,16); const raised=nextWork(t<'08:00'&&isWork(c)?c:add(c,1)); out.new.push({kind:'new',l,raised,age:wdays(raised,TODAY)});}
      if(['sent','followup'].includes(l.stage)&&l.lastContact&&diff(l.lastContact,TODAY)>=3){const r=silentRaised(l);out.silent.push({kind:'silent',l,raised:r,age:wdays(r,TODAY)});}
      if(l.stage==='nurture'&&!l.cleared.movein){
        let start=null; const mv=l.movein;
        if(mv.p==='date'&&diff(TODAY,mv.v)<=30&&diff(TODAY,mv.v)>=-30)start=add(mv.v,-30);
        if(mv.p==='month'){const f=mv.v+'-01';if(diff(TODAY,f)<=30&&diff(TODAY,f)>=-30)start=add(f,-30);}
        if(mv.p==='undecided'&&l.nurtureSince&&diff(l.nurtureSince,TODAY)>=60)start=add(l.nurtureSince,60);
        if(start){const r=nextWork(start>TODAY?TODAY:start);out.movein.push({kind:'movein',l,raised:r,age:wdays(r,TODAY)});}
      }
      if(l.viewing&&l.viewing.date===add(TODAY,1)&&!l.cleared.view)out.view.push({kind:'view',l,age:0});
      for(const f of l.fus)if(f.st==='open'&&f.date<=TODAY)out.fu.push({kind:'fu',l,f,age:0});
    }
    if(USERS[uid].role==='manager'&&l.flag&&!l.flag.confirmed)out.assign.push({kind:'assign',l,age:wdays(l.flag.since,TODAY)});
  }
  for(const k of ['new','silent','movein'])out[k].sort((a,b)=>(b.age>0)-(a.age>0)||b.age-a.age||a.l.name.localeCompare(b.l.name));
  return out;
}

function groupIndex(kind,id,fu){const rows=rowsFor(ME())[kind];return rows.findIndex(r=>r.l.id===id&&(!fu||r.f&&r.f.id===fu));}
function commit(kind,id,ch,fuId){
  const solo=['view','log'].includes(kind), l=lead(id), idx=solo?-1:groupIndex(kind,id,fuId);
  ui.card=null;
  l.lastContact=TODAY; l.lastChannel=ch;
  l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Contact',text:`${ACTION[kind]} · ${ch}`,actor:USERS[ME()].name});
  const from=l.stage;
  if(kind==='new'||(solo&&l.stage==='new')){l.stage='contacted';l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'System',text:'First Response Time stamped',actor:'System'});}
  if(kind==='silent'){l.followups++; if(l.stage==='sent')l.stage='followup';}
  if(kind==='movein'){l.stage='contacted';l.cleared.movein=true;}
  if(kind==='fu'){const f=l.fus.find(x=>x.id===fuId);f.st='done';}
  if(from!==l.stage)l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Stage',text:`${SN[from]} → ${SN[l.stage]}`,actor:USERS[ME()].name});
  if(solo){render();toast(`Contact logged · ${l.name} · ${ch} ✓`,{silent:true});return;}
  const left=badgeCount(), ns=NEXT[l.stage];
  const verb=kind==='new'?'Contacted':kind==='movein'?'Re-contacted':'Followed up';
  const confirm=`${verb} ${l.name} · ${ch}`;
  if(ns){
    ui.card={group:kind,index:Math.max(idx,0),leadId:id,confirm,prompt:ns.prompt,step:ns.step,left,stage:l.stage};
    const st=S.nextStats[l.stage]||(S.nextStats[l.stage]={shown:0,skip:0}); st.shown++; // T5: team-level, per Stage, never per Agent
    render(); toast(confirm+' ✓',{silent:true});
    $('#nextCard').focus();
  }else{
    render(); toast(confirm+' ✓',{silent:true}); focusAfterRemoval(kind,Math.max(idx,0)); announce(`Contact logged — ${left} left`);
  }
}
function focusAfterRemoval(kind,idx){
  const grp=$('#grp-'+kind);
  if(grp){const rows=[...grp.querySelectorAll('.rrow')];const r=rows[idx]||rows[idx-1];if(r){const b=r.querySelector('.acts .sb button,.acts .btn.pri')||r.querySelector('.acts button');(b||r).focus();return;}}
  const order=GROUPS.map(g=>g[0]);
  for(const k of order.slice(order.indexOf(kind)+1)){const h=$('#gh-'+k);if(h){h.focus();return;}}
  if(!$('.rgroup')&&$('#todayEmpty')){$('#todayEmpty').focus();return;}
  const cu=$('#cuH'); if(cu){cu.focus();return;}
}
function closeCard(dateN){
  const c=ui.card; if(!c)return;
  let msg='Skipped · nothing scheduled';
  if(dateN==null&&c.stage&&S.nextStats[c.stage])S.nextStats[c.stage].skip++;
  if(dateN!=null){const l=lead(c.leadId), d=typeof dateN==='string'?dateN:add(TODAY,dateN);
    l.fus.push({id:'F'+(++SEQ),date:d,step:c.step,st:'open'});
    l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Follow-up',text:`Follow-up scheduled for ${fd(d)} · ${c.step}`,actor:USERS[ME()].name});
    msg=`Follow-up scheduled · ${l.name} · ${fdw(d)}`;}
  ui.card=null; render(); focusAfterRemoval(c.group,c.index);
  toast(msg);
}

    <button class="btn sm" data-act="bulk-clear">Clear</button>${msg}</div>`;
}
function bulkMove(stage,ids){
  if(stage==='lost'){openLost(ids,null);return;}
  const moved=[];ids.forEach(id=>{const l=lead(id);if(l.stage!==stage){const f=l.stage;l.stage=stage;l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Stage',text:`${SN[f]} → ${SN[stage]}`,actor:USERS[ME()].name});moved.push(id);}});
  const total=ui.sel.size; ui.sel.clear(); ui.bulk=null; render();
  const msg=`${moved.length} moved to ${SN[stage]} · ${total-moved.length} left unchanged`; toast(msg);
  const c=moved.length&&$(`[data-card="${moved[0]}"]`); (c||$('#ch-'+stage)).focus();
}
function bulkApplyMove(){
  const stage=$('#bulkStage').value, ids=[...ui.sel];
  const blocked=ids.filter(id=>!canEdit(lead(id)));
  if(blocked.length){const who=[...new Set(blocked.map(id=>USERS[lead(id).owner].name))].join(', ');ui.bulk={op:'move',stage,blocked,who};render();announce(`${blocked.length} of ${ids.length} can't change: ${who} owns them.`);$('#bulkRemove').focus();return;}
  bulkMove(stage,ids);
}
function bulkApplyReassign(){
  const to=$('#bulkOwner').value, ids=[...ui.sel], av=S.avail[to];
  const away=av.s==='away', nolang=ids.filter(id=>!USERS[to].langs.includes(lead(id).lang));
  if(away)ui.bulk={op:'reassign',to,warn:`${USERS[to].name} is away through ${fd(av.until)} · ${ids.length} lead${ids.length>1?'s':''} affected: ${ids.map(id=>lead(id).name).join(', ')}.`};
  else if(nolang.length)ui.bulk={op:'reassign',to,warn:`${USERS[to].name} doesn't cover ${[...new Set(nolang.map(id=>LANGN[lead(id).lang]))].join(', ')} · ${nolang.length} lead${nolang.length>1?'s':''} affected: ${nolang.map(id=>lead(id).name).join(', ')}.`};
  else {doReassign(ids,to);return;}
  render(); announce(ui.bulk.warn); $('#selbar [data-act=bulk-confirm]').focus();
}
function doReassign(ids,to){
  ids.forEach(id=>{const l=lead(id),f=l.owner;l.owner=to;if(l.flag)l.flag.confirmed=true;l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'System',text:`Reassigned ${USERS[f].name} → ${USERS[to].name}`,actor:USERS[ME()].name});});
  ui.sel.clear();ui.bulk=null;render();toast(`${ids.length} reassigned to ${USERS[to].name} · each Lead has its own Timeline entry`);
  const c=$(`[data-card="${ids[0]}"]`); if(c)c.focus();
}
function wireBoard(){
  const b=$('#board'); if(!b)return;
  b.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.card);});
  b.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',()=>col.classList.remove('drop'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');const ids=ui.sel.has(id)?[...ui.sel]:[id];
      const st=col.dataset.stage; if(ids.some(x=>!canEdit(lead(x)))){toast("You have view access only on some of these leads.");return;}
      if(st==='lost'){openLost(ids,null);return;} ui.sel=new Set(ids); bulkMove(st,ids);});
  });
}
function cardClick(e,c){
  const id=c.dataset.card, col=c.closest('.col');

  if(e.shiftKey&&ui.anchor){const cards=[...col.querySelectorAll('[data-card]')].map(x=>x.dataset.card);const a=cards.indexOf(ui.anchor),b=cards.indexOf(id);

function selOf(el){
  if(!el||!el.dataset)return null; if(el.id)return '#'+el.id;
  if(el.dataset.card)return `[data-card="${el.dataset.card}"]`; if(el.dataset.row)return `[data-row="${el.dataset.row}"]`;
  if(el.dataset.act&&el.dataset.id)return `[data-act="${el.dataset.act}"][data-id="${el.dataset.id}"]`;
  if(el.dataset.act==='drill')return `[data-act=drill][data-a="${el.dataset.a}"][data-fig="${CSS.escape(el.dataset.fig)}"]`;
  return null;
}

function drillItems(a,fig,n,stage,cr){
  const pool=a==='team'?S.leads.filter(l=>OPEN(l.stage)):S.leads.filter(l=>l.owner===a);
  let L;
  if(fig==='Open Leads'||fig==='Weighted load')L=pool.filter(l=>OPEN(l.stage)).map(l=>({id:l.id,item:SN[l.stage],age:fig==='Weighted load'?'weight '+WEIGHT[l.stage]:'since '+fdm(l.created)}));
  else if(fig.startsWith('Stale'))L=pool.filter(l=>l.stage===stage).slice(0,1).map(l=>({id:l.id,item:SN[l.stage]+' · no change 21 days',age:'21 days'}));
  else if(fig==='Language mismatch')L=S.leads.filter(l=>l.flag&&l.flag.t==='language mismatch').map(l=>({id:l.id,item:LANGN[l.lang]+' · owner '+USERS[l.owner].name,age:'1 working day'}));
  else if(fig==='Fallback-owned')L=S.leads.filter(l=>l.flag&&l.flag.t==='Fallback').concat(S.leads.filter(l=>l.owner==='hannah'&&l.lang==='ko'&&!l.flag).slice(0,1)).concat(S.leads.filter(l=>l.name==='Choi Seung-hyun')).slice(0,2).map(l=>({id:l.id,item:'Fallback · '+LANGN[l.lang],age:'0 working days'}));
  else if(a==='team')L=pool.filter(l=>l.stage==='new'||l.stage==='contacted').slice(0,n).map(l=>({id:l.id,item:fig,age:fdm(l.created)}));
  else{
    const items=['Silent','New','Move-in','Silent'];
    const src=fig.startsWith('Signed')?pool.filter(l=>l.stage==='signed').concat(pool.filter(l=>l.stage!=='signed')):pool.slice();
    L=src.slice(0,n).map((l,i)=>({id:l.id,item:fig.startsWith('Signed')?(l.stage==='signed'?'Signed':SN[l.stage]):fig==='Overrides'?'not Qualified → Qualified':fig==='Contacts before Lost'?(l.lostReason||'Lost')+' · '+(2+i%3)+' contacts':items[i%4],age:fig.includes('verdue')?(3-i%3)+' working day'+(3-i%3>1?'s':''):fdm(l.created),edited:cr&&i===0&&fig!=='Overrides'}));
  }

  return L;
}

function matchUnits(l){
  const tests=[['Property type',u=>!l.types.length||l.types.includes(u.type)],['Budget',u=>u.price<=l.budget*1.1],['Term',u=>u.minTerm<=l.termTo],['Bedrooms',u=>u.beds>=l.beds],['Pets',u=>!l.pets||u.am.pets!=='no']];
  const list=S.units.filter(u=>tests.every(([,t])=>t(u)));
  let empty='';
  if(!list.length){const worst=tests.map(([n,t])=>[n,S.units.filter(u=>!t(u)).length]).sort((a,b)=>b[1]-a[1])[0];empty=`${worst[0]} removed the most units (${worst[1]} of ${S.units.length}).`;}
  return {list,empty};
}

let toastT=null;
function toast(msg,{silent}={}){
  const t=$('#toast'); clearTimeout(toastT); ui.pendingUndo&&finishUndo(false);
  t.setAttribute('aria-live',silent?'off':'polite'); t.innerHTML=''; t.textContent=msg; t.classList.add('on');

function announce(msg){const s=$('#sr');s.textContent='';setTimeout(()=>{s.textContent=msg;},30);}
function undoToast(msg,onUndo,onEnd){
  const t=$('#toast'); clearTimeout(toastT); if(ui.pendingUndo)finishUndo(false);
  t.setAttribute('aria-live','polite'); t.innerHTML=`<span>${esc(msg)}</span><button class="lnk" id="undoBtn">Undo</button>`; t.classList.add('on');
  ui.pendingUndo={onUndo,onEnd};
  const b=$('#undoBtn'); b.onclick=()=>finishUndo(true);
  let hold=false; const arm=()=>{clearTimeout(toastT);toastT=setTimeout(()=>{if(!hold)finishUndo(false);},5000);};
  t.onmouseenter=()=>{hold=true;clearTimeout(toastT);}; t.onmouseleave=()=>{hold=false;arm();};
  b.onfocus=()=>{hold=true;clearTimeout(toastT);}; b.onblur=()=>{hold=false;if(ui.pendingUndo)arm();};
  arm(); b.focus();
}
function finishUndo(undo){
  const p=ui.pendingUndo; if(!p)return; ui.pendingUndo=null; clearTimeout(toastT);

    case 'lost-confirm': { const r=$('#modal input[name=lr]:checked'); if(!r){$('#lostErr').textContent='Pick a Lost Reason.';return;} const ids=modalCtx.ids;
      ids.forEach(id=>{const l=lead(id),f=l.stage;l.stage='lost';l.lostReason=r.value;l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Stage',text:`${SN[f]} → Lost · ${r.value}`,actor:USERS[ME()].name});});
      closeModal({noFocus:true}); ui.sel.clear(); ui.bulk=null; render(); toast(`${ids.length>1?ids.length+' leads':lead(ids[0]).name} marked Lost · ${r.value}`); (($('#dTitle'))||$('#ch-lost')||$('#pageTitle')).focus?.(); break; }
    case 'lost-nurture': { const ids=modalCtx.ids; ids.forEach(id=>{const l=lead(id),f=l.stage;l.stage='nurture';l.nurtureSince=TODAY;l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Stage',text:`${SN[f]} → Nurture`,actor:USERS[ME()].name});}); closeModal({noFocus:true}); ui.sel.clear(); render(); toast(`Moved to Nurture instead of Lost`); break; }
    case 'send-units': { const l=lead(d.id), picked=[...$$('#drawer input[name=mu]:checked')].map(x=>x.value); if(!picked.length){toast('Pick at least one unit to send.');return;} openSendUnits(l,picked,a); break; }
    case 'su-mark': markSent(); break;
    case 'su-copy': copyText(modalCtx.send.text,'Message copied',"Couldn't copy automatically · select the preview text instead"); break;
    case 'su-share': { const txt=modalCtx.send.text; try{ navigator.share({text:txt}).catch(()=>{}); }catch(err){} break; }
    case 'copy-contact': { if(popCtx)closePop(); copyContact(d); break; }
    case 'chatmenu': openPop(`<div role="menu" aria-label="Open chat with ${esc(lead(d.id).name)}">${chatMenuItems(lead(d.id)).join('')}</div>`,a,{role:'menu',menu:true}); break;
    case 'chat-pick': { const ch=a.dataset.ch; if(a.dataset.copy&&modalCtx&&modalCtx.msg){ try{ navigator.clipboard.writeText(modalCtx.msg.text).catch(()=>{}); }catch(err){} } if(modalCtx&&modalCtx.msg)depart(ch); closePop(); break; }
    case 'msg': openMessage(a); break;
    case 'msg-copy': { const c=modalCtx.msg; clipWrite(c.text).then(ok=>{ if(ok){toast('Message copied',{silent:true});announce('Message copied');} else $('#mStatus').textContent="Couldn't copy. Select the text below to copy it yourself, or open chat only."; }); break; }
    case 'msg-copyopen': msgCopyOpen(); break;
    case 'msg-openonly': leaveTo(); break;
    case 'rp-go': { const p=ui.prompt; ui.prompt=null;
      if(p.kind==='view'){ unitChecked(p.id,p.origin==='profile'?'profile':'today'); break; }
      commit(p.kind,p.id,p.ch,p.fu);
      if(p.origin==='profile'&&ui.drawer){ const t=$('#dTitle'); t&&t.focus(); }
      else if(p.kind==='log'){ $('#todayH')&&$('#todayH').focus(); } break; }
    case 'rp-no': { const p=ui.prompt; ui.prompt=null; render();
      const row=p.kind==='log'?null:$(`#row-${p.kind}-${p.id}${p.fu?'-'+p.fu:''}`);
      const t=p.origin==='profile'&&ui.drawer?($('#profileMsg')||$('#dTitle')):row?(row.querySelector('.sb button,.acts .btn.pri')||row):$('#pageTitle'); t&&t.focus(); break; }
    case 'kpi-toggle': ui.kpiOpen=!ui.kpiOpen; render(); $('#kpiSum').focus(); break;
    case 'upd-more': ui.updOpen=!ui.updOpen; render(); $('#updMore').focus(); break;
    case 'unit-checked': unitChecked(d.id,d.from); break;
    case 'drill-pipeline': { const dd=ui.drawer, ids=[...new Set(dd.items.filter(it=>!it.record).map(it=>it.id))];
      ui.drawer=null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#app').inert=false; $('#drawer').innerHTML='';
      const still=ids.filter(id=>lead(id).owner===dd.a);
      ui.boardOwner=dd.a; ui.sel=new Set(still); ui.bulk=null;
      ui.selFrom={key:still.slice().sort().join(),msg:still.length===ids.length?`${still.length} leads selected from ${dd.figName.replace('>1','more than 1')} · ${ANON[dd.a]}`:`${still.length} of ${ids.length} selected · ${ids.length-still.length} are now owned by someone else`};
      go('board'); const sc=$('#selCount'); if(sc)sc.focus(); announce(ui.selFrom.msg); break; }
    case 'vout': { const l=lead(d.id); l.viewing.outcome=d.v; l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'System',text:'Viewing outcome: '+d.v,actor:USERS[ME()].name}); render(); toast(`Viewing outcome recorded · ${d.v}`); break; }
    case 'logcontact': { const l=lead(d.id), ch=$('#lcCh').value; if(!ch){$('#lcErr').textContent='Choose a Channel.';$('#lcCh').focus();return;}
      const when=$('#lcWhen').value, msg=$('#lcMsg').value.trim(); l.lastChannel=ch; l.lastContact=TODAY;
      l.timeline.push({at:when||TODAY+'T'+NOW_TIME,type:'Contact',text:`${ch}${msg?' · “'+msg+'”':''}${when&&when!==TODAY+'T'+NOW_TIME?' · logged '+NOW_TIME:''}`,actor:USERS[ME()].name});
      if(l.stage==='new'){l.stage='contacted';l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Stage',text:'New → Contacted',actor:USERS[ME()].name});}
      render(); toast(`Contact logged · ${l.name} · ${ch}`); $('#schedBtn')&&$('#schedBtn').focus(); break; }
    case 'sched': { const l=lead(d.id); $('#schedForm').innerHTML=`<div class="row-flex" style="margin:8px 0"><label class="f">Date <input type="date" id="sfDate" min="${TODAY}" value="${add(TODAY,2)}"></label><label class="f">Step <select id="sfStep"><option>Follow up</option><option>Send units</option><option>Book a viewing</option></select></label><button class="btn sm pri" data-act="sched-ok" data-id="${l.id}" style="align-self:flex-end">Schedule</button><button class="btn sm" data-act="sched-x" style="align-self:flex-end">Cancel</button></div>`; $('#sfDate').focus(); break; }
    case 'sched-x': $('#schedForm').innerHTML=''; $('#schedBtn').focus(); break;
    case 'sched-ok': { const l=lead(d.id), v=$('#sfDate').value, st=$('#sfStep').value; if(!v){$('#sfDate').focus();return;} const nf={id:'F'+(++SEQ),date:v,step:st,st:'open'}; l.fus.push(nf);
      l.timeline.push({at:TODAY+'T'+NOW_TIME,type:'Follow-up',text:`Follow-up scheduled for ${fd(v)} · ${st}`,actor:USERS[ME()].name}); render(); toast(`Follow-up scheduled · ${fdw(v)} · Reminder goes to ${USERS[l.owner].name}`); $(`[data-act=upmenu][data-fu="${nf.id}"]`)?.focus(); break; }
    case 'range': ui.range=d.v; render(); { const b=$(`[data-act=range][data-v="${d.v}"]`); b&&b.focus(); announce(`${a.textContent} · ${cuCount()} item${cuCount()===1?'':'s'}`);} break;
    case 'board-owner': ui.boardOwner=d.owner; go('board'); break;
    case 'bulk-clear': ui.sel.clear(); ui.bulk=null; render(); break;
    case 'bulk-move': bulkApplyMove(); break;
    case 'bulk-remove': { const b=ui.bulk; b.blocked.forEach(id=>ui.sel.delete(id)); ui.bulk=null; bulkMove(b.stage,[...ui.sel]); break; }
    case 'bulk-reassign': bulkApplyReassign(); break;
    case 'bulk-confirm': doReassign([...ui.sel],ui.bulk.to); break;
    case 'bulk-cancel': ui.bulk=null; render(); break;
    case 'export': toast('Export prepared · CSV without phone or email'); break;
    case 'filters': { if(phone()){ui.ufDraft=JSON.parse(JSON.stringify(ui.uf));openModal(filtersBody(ui.ufDraft,true),{label:'fTitle',mode:'sheet',trigger:a,initial:'.chip'});} else openPop(filtersBody(ui.uf,false),a,{role:'dialog',label:'fTitle',width:340,initial:'.chip'}); break; }
    case 'ftype': case 'fam': { const f=modalCtx?ui.ufDraft:ui.uf;
      if(act==='ftype'){const i=f.types.indexOf(d.v);i>=0?f.types.splice(i,1):f.types.push(d.v);a.setAttribute('aria-pressed',i<0);}
      else{f.am[d.k]=d.v;a.parentElement.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-checked',b===a);b.tabIndex=b===a?0:-1;});}
      if(!modalCtx){const keep=a; $('#view').innerHTML=vUnits(); renderNav(); if(popCtx)popCtx.trigger=$('#filtersBtn'); keep.focus(); clearTimeout(budT); budT=setTimeout(()=>announce($('#unitCount').textContent),600);} break; }
    case 'fapply': ui.uf=ui.ufDraft; closeModal({noFocus:true}); render(); $('#unitCount').focus(); break;
    case 'fclear-sheet': ui.ufDraft={types:[],am:{}}; $('#modal').innerHTML=filtersBody(ui.ufDraft,true); $('#modal .chip').focus(); break;
    case 'rmfilter': { const chips=$$('#fchips [data-act=rmfilter]'), i=+d.i, name=a.getAttribute('aria-label').replace('Remove filter ','');
      if(d.t==='type')ui.uf.types=ui.uf.types.filter(x=>x!==d.k); else delete ui.uf.am[d.k]; render();
      const nc=$$('#fchips [data-act=rmfilter]'); (nc[i]||nc[i-1]||$('#filtersBtn')).focus(); announce(`${name} removed · ${unitsFiltered().length} units`); break; }
    case 'clearfilters': ui.uf={types:[],am:{}}; render(); $('#filtersBtn').focus(); break;
    case 'verify': { const u=S.units.find(x=>x.id===d.u); u.verified=TODAY; render(); toast(`${u.name} verified today`); $(`[data-act=verify][data-u="${u.id}"]`)?.focus(); break; }
    case 'wlperiod': ui.wlPeriod=d.v; render(); $(`[data-act=wlperiod][data-v="${d.v}"]`).focus(); break;
    case 'wlsort': ui.wlSort=d.v; lsSet('wlSort',d.v); render(); $(`[data-act=wlsort][data-v="${d.v}"]`).focus(); break;
    case 'crperiod': ui.crPeriod=d.v; render(); $(`[data-act=crperiod][data-v="${d.v}"]`).focus(); break;
    case 'lostby': ui.lostOpen[d.a]=!ui.lostOpen[d.a]; render(); $(`[data-act=lostby][data-a="${d.a}"]`).focus(); break;
    case 'criteria': toast('Qualification criteria: budget floor 15M · minimum term 6 months (Tenant settings)'); break;
    case 'drill': openDrill(a); break;
    case 'drill-open': { const dd=ui.drawer, it=dd.items[+d.i]; dd.scroll=$('#drillBody').scrollTop; dd.focusIdx=+d.i; dd.open={id:it.id,record:it.record,tab:'profile'}; renderDrawer(); $('#drawer').setAttribute('aria-labelledby','dTitle'); $('#dTitle').focus(); break; }
    case 'drill-back': { const dd=ui.drawer; dd.open=null; renderDrawer(); $('#drillBody').scrollTop=dd.scroll||0; $$('#drillBody [data-act=drill-open]')[dd.focusIdx||0].focus(); break; }
    case 'nl-type': { const c=modalCtx.nl,i=c.types.indexOf(d.v); i>=0?c.types.splice(i,1):c.types.push(d.v); a.setAttribute('aria-pressed',i<0); break; }
    case 'nl-nopref': { const c=modalCtx.nl; c.noPref=!c.noPref; a.setAttribute('aria-pressed',c.noPref); $('#nArea').disabled=c.noPref; break; }
    case 'nl-mv': { const c=modalCtx.nl; c.mv=d.v; a.parentElement.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-checked',b===a);b.tabIndex=b===a?0:-1;}); $('#nMvDate').hidden=d.v!=='date'; $('#nMvMonth').hidden=d.v!=='month'; break; }
    case 'nl-more': { const m=$('#nlMore'), open=m.hidden; m.hidden=!open; a.setAttribute('aria-expanded',open); a.textContent='More details '+(open?'▾':'▸'); break; }
    case 'nl-save': nlSave(); break;
    case 'dismiss-merged': $('#dupBox').innerHTML=''; $('#nName').focus(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='roleSel'){ui.role=t.value;ui.card=null;ui.sel.clear();ui.bulk=null;ui.boardOwner='all';if(ui.drawer){ui.drawer=null;$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#app').inert=false;}render();toast('Signed in as '+(isMgr()?'Saki Taguchi · Manager':'Saki · Agent'));}
  if(t.id==='themeSel'){applyTheme(t.value);lsSet('theme',t.value);}
  if(t.id==='boardOwner'){ui.boardOwner=t.value;render();$('#boardOwner').focus();}
  if(t.dataset.sel){toggleSel(t.dataset.sel);}
  if(t.id==='stageF'){ui.stageF=t.value;render();$('#stageF').focus();}
  if(t.id==='trialOff'){ui.trialOff=t.checked;render();$('#trialOff').focus();}
  if(t.id==='wlWeek'){ui.wlWeek=t.value;render();$('#wlWeek').focus();}
  if(t.id==='nNat'){$('#nNatOW').hidden=t.value!=='Other';}
  if(t.name==='mu'){const n=$$('#drawer input[name=mu]:checked').length,b=$('#sendBtn');if(b){b.disabled=!n;$('#sendN').textContent=n;}}
  if(t.id==='suCh'){$('#suMark').disabled=!t.value;}
  if(t.id==='mCh'&&modalCtx&&modalCtx.msg){const l=lead(modalCtx.msg.id);modalCtx.msg.ch=t.value||null;$('#mActs').innerHTML=msgActions(l,t.value||null);$('#mAddr').textContent=t.value?addrOf(l,t.value):'';}
  if(t.name==='ra'){$('#raWarn').textContent=t.dataset.warn?t.dataset.warn+'. You can still assign.':'';modalCtx.warned=!!t.dataset.warn&&false;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);}
  if(t.id==='nBudget')nlBudget();
  if(t.id==='nPhone'||t.id==='nEmail')nlDup();
  if(t.id==='avNote'){const n=t.value.length,c=t.closest('.pop,.modal');c.querySelector('#avCnt').textContent=n+'/80';const live=c.querySelector('#avLive');if(n>=70&&!t._warned){t._warned=true;live.textContent=(80-n)+' characters left';}if(n<70)t._warned=false;}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){
    if(popCtx){e.preventDefault();if(dpCb&&$('#pop #dpDate')){dpCb=null;}closePop();return;}
    if(modalCtx){e.preventDefault();if(dpCb)dpCb=null;closeModal();return;}
    if(ui.drawer){e.preventDefault();closeDrawer();return;}
    if(ui.page==='board'&&ui.sel.size){ui.sel.clear();ui.bulk=null;render();announce('Selection cleared');return;}
  }
  // menus: arrow keys
  const menu=t.closest&&t.closest('[role=menu]');
  if(menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const it=[...menu.querySelectorAll('[role=menuitem]')],i=it.indexOf(t);
    const n=e.key==='ArrowDown'?(i+1)%it.length:e.key==='ArrowUp'?(i-1+it.length)%it.length:e.key==='Home'?0:it.length-1;it[n].focus();return;}
  // radio-group segmented controls
  const rg=t.closest&&t.closest('[role=radiogroup]');
  if(rg&&t.getAttribute('role')==='radio'&&['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const it=[...rg.querySelectorAll('[role=radio]')],i=it.indexOf(t);const n=(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+it.length)%it.length;it[n].focus();it[n].click();return;}
  // tabs
  if(t.getAttribute&&t.getAttribute('role')==='tab'&&['ArrowRight','ArrowLeft'].includes(e.key)){const it=[...t.parentElement.children],i=it.indexOf(t);it[(i+(e.key==='ArrowRight'?1:-1)+it.length)%it.length].click();return;}
  // cards / rows
  if(e.key==='Enter'&&t.dataset&&t.dataset.card){openLead(t.dataset.card,{trigger:t});return;}
  if(e.key==='Enter'&&t.dataset&&t.dataset.row){openLead(t.dataset.row,{trigger:t});return;}
  // focus trap
  if(e.key==='Tab'){
    const box=modalCtx?$('#modal'):ui.drawer?$('#drawer'):null; if(!box)return;
    const f=[...box.querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&!x.hidden&&x.offsetParent!==null);
    if(!f.length)return; const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||!box.contains(document.activeElement))){e.preventDefault();first.focus();}
  }
});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES.some(x=>x[0]===p)&&p!==ui.page){ui.card=null;ui.page=p;render();}});
document.addEventListener('click',e=>{const n=e.target.closest('#nav a');if(n){e.preventDefault();go(n.dataset.page);}},true);

/* =================== Theme & boot =================== */
function applyTheme(v){if(v==='light'||v==='dark')document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');}
(function boot(){
  const th=lsGet('theme')||'system'; $('#themeSel').value=['light','dark','system'].includes(th)?th:'system'; applyTheme($('#themeSel').value);
  const p=location.hash.slice(1); if(PAGES.some(x=>x[0]===p))ui.page=p;
  const r=new URLSearchParams(location.search).get('role'); if(r==='manager'){ui.role='manager';$('#roleSel').value='manager';}
  render();
})();
</script>
